name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install

      - name: Test Sales authentication and Excel export
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js \
            --output "$RUNNER_TEMP/sales-sheetjs.cjs"
          actual="$(openssl dgst -sha384 -binary "$RUNNER_TEMP/sales-sheetjs.cjs" | openssl base64 -A)"
          test "$actual" = "vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
          cp public/admin/exceljs.min.js "$RUNNER_TEMP/sales-exceljs.cjs"
          SALES_TEST_SHEETJS="$RUNNER_TEMP/sales-sheetjs.cjs" \
          SALES_TEST_EXCELJS="$RUNNER_TEMP/sales-exceljs.cjs" \
            node --test test/sales-admin.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 test/backup-sales.test.py

      - name: Build
        run: npm run build
        env:
          PUBLIC_CERTIFICATES_API_URL: ${{ vars.PUBLIC_CERTIFICATES_API_URL }}
          # This is a public Worker origin; never put credentials in PUBLIC_ variables.
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.PUBLIC_CONTACT_FORM_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
