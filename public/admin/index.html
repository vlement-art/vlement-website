<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Artworks Admin — vlement</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --ink: #1c1a17;
    --muted: #6b6459;
    --line: #e4e0d9;
    --accent: #b5482f;
    --accent-ink: #ffffff;
    --danger: #b02a2a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #f0eee9; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: #9c3c26; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover { background: #8f2222; }
  .btn:disabled { opacity: .5; cursor: default; }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; }

  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    gap: 16px;
    text-align: center;
  }
  #login-screen p { color: var(--muted); max-width: 360px; }
  #login-status { color: var(--danger); font-size: 13px; min-height: 1.25em; }
  #topbar-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .thumb {
    aspect-ratio: 1 / 1;
    background: #eee repeating-conic-gradient(#e5e5e5 0% 25%, #fff 0% 50%) 50% / 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: auto; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .code-label { font-size: 12px; font-weight: 600; color: var(--accent); }
  .card .actions { display: flex; gap: 8px; padding: 0 12px 12px; }
  .card .actions .btn { flex: 1; justify-content: center; padding: 6px 10px; font-size: 13px; }
  .code-manager-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .code-manager-details, .code-manager-controls { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .code-manager-controls { width: min(100%, 220px); }
  .code-manager-controls select, .code-manager-controls input { width: 100%; }
  .code-manager-controls .btn { justify-content: center; }
  .code-label { font-size: 13px; font-weight: 600; color: var(--accent); }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,18,15,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 32px 16px; overflow-y: auto; z-index: 100;
  }
  .modal {
    background: var(--panel);
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .field .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row label { font-size: 13px; font-weight: 600; }

  .image-field { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .image-field input[type=file] { min-width: 0; max-width: 100%; }
  .image-field .preview {
    width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
    background: #eee repeating-conic-gradient(#e5e5e5 0% 25%, #fff 0% 50%) 50% / 12px 12px;
    flex: none; display: flex; align-items: center; justify-content: center;
  }
  .image-field .preview img { width: 100%; height: 100%; object-fit: contain; }
  .image-field .preview span { font-size: 10px; color: var(--muted); }

  .modal-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .modal-footer .right { display: flex; gap: 8px; }

  .status-banner {
    font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px;
  }
  .status-banner.error { background: #fbe7e5; color: var(--danger); }
  .status-banner.info { background: #eef2f6; color: #33546b; }

  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.15); border-top-color: var(--ink);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    header.topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
    #topbar-actions { justify-content: flex-start; width: 100%; }
    #topbar-actions .btn { flex: 1 1 auto; justify-content: center; }
    .code-manager-row { align-items: stretch; flex-direction: column; }
    .code-manager-controls { width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>Artworks Admin</h1>
  <div id="topbar-actions"></div>
</header>

<main>
  <div id="login-screen">
    <h2>Sign in to manage artworks</h2>
    <p>This connects to your GitHub repository (<code>vlement-art/vlement-website</code>) to add, edit, and delete artwork entries directly.</p>
    <button class="btn primary" id="login-btn">Sign in with GitHub</button>
    <div id="login-status"></div>
  </div>

  <div id="app-screen" hidden>
    <div id="banner-area"></div>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div id="list-status" style="color:var(--muted); font-size:14px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="refresh-btn" title="Re-fetch all artworks from GitHub">Refresh</button>
        <button class="btn primary" id="new-entry-btn">+ New Artwork</button>
      </div>
    </div>
    <div class="grid" id="entry-grid"></div>
    <div class="empty-state" id="empty-state" hidden>No artworks yet. Click "New Artwork" to add one.</div>
  </div>
</main>

<div class="overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<script src="/admin/export-excel.js"></script>
<script src="/admin/dimensions.js"></script>
<script>
/* ---------------------------------------------------------------------
   CONFIG — matches config.yml
--------------------------------------------------------------------- */
const REPO_OWNER = 'vlement-art';
const REPO_NAME = 'vlement-website';
const BRANCH = 'main';
const AUTH_WORKER = 'https://ancient-sunset-49c4.jmrdea.workers.dev';
const CONTENT_DIR = 'src/content/artworks';
const IMAGE_DIR = 'public/images/artwork';
const IMAGE_PUBLIC_PREFIX = '/images/artwork';
const DOWNLOAD_DIR = 'public/images/downloads';
const DOWNLOAD_PUBLIC_PREFIX = '/images/downloads';
const THUMB_DIR = 'public/images/thumbnails';
const THUMB_PUBLIC_PREFIX = '/images/thumbnails';
const HOMEPAGE_SETTINGS_PATH = 'src/data/homepage.json';

const CATEGORY_OPTIONS = ['Print', 'Original painting', 'Drawing', 'Mixed media'];
const COLLECTION_OPTIONS = ['Yellow Balloon', 'Coastal Studies'];

const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;

/* ---------------------------------------------------------------------
   STATE
--------------------------------------------------------------------- */
let token = sessionStorage.getItem('gh_token') || null;
let entries = []; // { path, sha, slug, data:{...}, body:"" }
let homepageSettings = { heroSlug: null, heroImageField: null };
let loginAttemptCleanup = null;

/* ---------------------------------------------------------------------
   AUTH — reuses the existing Sveltia OAuth worker/callback
--------------------------------------------------------------------- */
function login() {
  if (loginAttemptCleanup) return;

  const width = 600, height = 700;
  const left = window.screenX + (window.outerWidth - width) / 2;
  const top = window.screenY + (window.outerHeight - height) / 2;
  const loginButton = document.getElementById('login-btn');
  const loginStatus = document.getElementById('login-status');
  let popup = null;
  let closeCheck = null;
  let timeout = null;

  const cleanup = (message = '') => {
    window.removeEventListener('message', handleMessage);
    if (closeCheck) clearInterval(closeCheck);
    if (timeout) clearTimeout(timeout);
    if (popup && !popup.closed) popup.close();
    loginAttemptCleanup = null;
    loginButton.disabled = false;
    loginButton.textContent = 'Sign in with GitHub';
    loginStatus.textContent = message;
  };
  loginAttemptCleanup = cleanup;

  function handleMessage(e) {
    if (e.source !== popup || typeof e.data !== 'string') return;

    if (e.data === 'authorizing:github') {
      e.source.postMessage('authorizing:github', e.origin);
      return;
    }

    if (e.data.startsWith('authorization:github:success:')) {
      let payload;
      try {
        payload = JSON.parse(e.data.slice('authorization:github:success:'.length));
      } catch {
        cleanup('Sign-in returned an invalid response. Please try again.');
        return;
      }
      if (!payload || typeof payload.token !== 'string' || !payload.token) {
        cleanup('GitHub did not return an access token. Please try again.');
        return;
      }
      token = payload.token;
      sessionStorage.setItem('gh_token', token);
      cleanup();
      showApp();
      return;
    }

    if (e.data.startsWith('authorization:github:error:')) {
      let payload;
      try {
        payload = JSON.parse(e.data.slice('authorization:github:error:'.length));
      } catch {
        cleanup('GitHub sign-in failed. Please try again.');
        return;
      }
      cleanup('Sign-in failed: ' + (payload?.error || 'unknown error'));
    }
  }

  window.addEventListener('message', handleMessage);
  loginButton.disabled = true;
  loginButton.textContent = 'Opening GitHub…';
  loginStatus.textContent = 'Complete sign-in in the GitHub window.';
  try {
    popup = window.open(
      `${AUTH_WORKER}/auth?provider=github&site_id=${location.hostname}&scope=repo`,
      'github-oauth',
      `width=${width},height=${height},left=${left},top=${top}`
    );
  } catch {
    cleanup('Could not open GitHub sign-in. Please check your browser settings and try again.');
    return;
  }
  if (!popup) {
    cleanup('Your browser blocked the sign-in window. Allow pop-ups for vlement.com, then try again.');
    return;
  }

  loginButton.textContent = 'Waiting for GitHub…';
  closeCheck = setInterval(() => {
    if (popup.closed) cleanup('The GitHub sign-in window closed before sign-in completed. Please try again.');
  }, 500);
  timeout = setTimeout(() => {
    cleanup('GitHub sign-in timed out. If the sign-in window is still open, finish there and try again.');
  }, 180000);
}

function logout() {
  token = null;
  sessionStorage.removeItem('gh_token');
  location.reload();
}

/* ---------------------------------------------------------------------
   GITHUB API HELPERS (REST Contents API — not GraphQL)
--------------------------------------------------------------------- */
async function ghRequest(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    cache: 'no-store',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
  if (!res.ok && res.status !== 404) {
    const text = await res.text().catch(() => '');
    const err = new Error(`GitHub API ${res.status}: ${text || res.statusText}`);
    err.status = res.status;
    throw err;
  }
  return res;
}

async function ghGetFile(path) {
  const res = await ghRequest(`/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${BRANCH}`);
  if (res.status === 404) return null;
  return res.json();
}

async function ghListDir(path) {
  const res = await ghRequest(`/contents/${path}?ref=${BRANCH}`);
  if (res.status === 404) return [];
  return res.json();
}

async function ghPutFile(path, base64Content, message, sha) {
  const res = await ghRequest(`/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message,
      content: base64Content,
      branch: BRANCH,
      ...(sha ? { sha } : {})
    })
  });
  if (!res.ok) {
    const err = new Error(`GitHub could not save ${path} (${res.status}).`);
    err.status = res.status;
    throw err;
  }
  return res.json(); // { content: { sha, path, ... }, commit: {...} }
}

// Wraps ghPutFile: if GitHub reports the sha is stale (409 conflict), re-fetch the
// file's current sha and retry once automatically instead of failing the save.
async function ghPutFileSafe(path, base64Content, message) {
  const existing = await ghGetFile(path);
  try {
    return await ghPutFile(path, base64Content, message, existing?.sha);
  } catch (err) {
    if (err.status === 409) {
      const fresh = await ghGetFile(path);
      return await ghPutFile(path, base64Content, message, fresh?.sha);
    }
    throw err;
  }
}

async function ghDeleteFile(path, sha, message) {
  await ghRequest(`/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, sha, branch: BRANCH })
  });
}

/* ---------------------------------------------------------------------
   ENCODING HELPERS
--------------------------------------------------------------------- */
function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function slugify(str) {
  return str.toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '') || 'artwork';
}
function extOf(filename) {
  const m = /\.([a-zA-Z0-9]+)$/.exec(filename);
  return m ? m[1].toLowerCase() : 'jpg';
}

async function jpegOrientation(file) {
  if (file.type !== 'image/jpeg') return 1;
  const buffer = await file.arrayBuffer();
  const view = new DataView(buffer);
  if (view.byteLength < 4 || view.getUint16(0) !== 0xffd8) throw new Error('The JPEG image could not be read.');
  let offset = 2;
  while (offset + 4 <= view.byteLength) {
    if (view.getUint8(offset) !== 0xff) break;
    const marker = view.getUint8(offset + 1);
    if (marker === 0xda || marker === 0xd9) break;
    const length = view.getUint16(offset + 2);
    const end = offset + 2 + length;
    if (length < 2 || end > view.byteLength) throw new Error('The JPEG image metadata is invalid.');
    const start = offset + 4;
    if (marker === 0xe1 && start + 14 <= end && view.getUint32(start) === 0x45786966
      && view.getUint16(start + 4) === 0) {
      const tiff = start + 6;
      const order = view.getUint16(tiff);
      if (order !== 0x4949 && order !== 0x4d4d) throw new Error('The JPEG orientation metadata is invalid.');
      const little = order === 0x4949;
      if (view.getUint16(tiff + 2, little) !== 42) throw new Error('The JPEG orientation metadata is invalid.');
      const ifd = tiff + view.getUint32(tiff + 4, little);
      if (ifd + 2 > end) throw new Error('The JPEG orientation metadata is invalid.');
      const count = view.getUint16(ifd, little);
      for (let index = 0; index < count; index++) {
        const entry = ifd + 2 + index * 12;
        if (entry + 12 > end) throw new Error('The JPEG orientation metadata is invalid.');
        if (view.getUint16(entry, little) === 0x0112) {
          if (view.getUint16(entry + 2, little) !== 3 || view.getUint32(entry + 4, little) !== 1) {
            throw new Error('The JPEG orientation metadata is invalid.');
          }
          const value = view.getUint16(entry + 8, little);
          if (value < 1 || value > 8) throw new Error('The JPEG orientation metadata is invalid.');
          return value;
        }
      }
    }
    offset = end;
  }
  return 1;
}

async function normalizeImageOrientation(file) {
  if (await jpegOrientation(file) === 1) return file;
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    const context = canvas.getContext('2d');
    if (!context) throw new Error('Could not prepare image.');
    context.drawImage(bitmap, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
    if (!blob) throw new Error('Could not encode image.');
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch {
    throw new Error('Could not correct this photo’s orientation. Choose a different image or rotate and save it first.');
  } finally {
    bitmap?.close();
  }
}

async function chooseNewSlug(title, requireCodes) {
  const base = slugify(title).slice(0, 110).replace(/-+$/, '') || 'artwork';
  if (requireCodes) {
    if (!window.VlementAdminArtworkCodes) throw new Error('Artwork codes are unavailable. Reload the page before duplicating an artwork.');
    await window.VlementAdminArtworkCodes.load();
  }
  for (let suffix = 1; suffix <= 10000; suffix++) {
    const slug = suffix === 1 ? base : `${base}-${suffix}`;
    if (entries.some(entry => entry.slug === slug) || window.VlementAdminArtworkCodes?.getCode(slug)) continue;
    if (!await ghGetFile(`${CONTENT_DIR}/${slug}.md`)) return slug;
  }
  throw new Error('Could not find an unused artwork ID. Change the title and try again.');
}

/* ---------------------------------------------------------------------
   FRONTMATTER PARSE / BUILD
--------------------------------------------------------------------- */
let yamlLibraryPromise = null;
function ensureYamlLibrary() {
  if (window.jsyaml?.load && window.jsyaml?.dump) {
    return Promise.resolve(window.jsyaml);
  }
  if (!yamlLibraryPromise) {
    yamlLibraryPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = new URL('/admin/js-yaml.min.js', location.origin).href;
      script.onload = () => {
        if (window.jsyaml?.load && window.jsyaml?.dump) {
          resolve(window.jsyaml);
        } else {
          reject(new Error('The YAML parser loaded but is unavailable. Refresh the page and try again.'));
        }
      };
      script.onerror = () => {
        reject(new Error(`Could not load the YAML parser from ${script.src}. Refresh the page and try again.`));
      };
      document.head.appendChild(script);
    }).catch(err => {
      yamlLibraryPromise = null;
      throw err;
    });
  }
  return yamlLibraryPromise;
}

function parseFrontmatter(raw) {
  const match = /^---\n([\s\S]*?)\n---\n?([\s\S]*)$/.exec(raw);
  if (!match) return { data: {}, body: raw };
  const data = jsyaml.load(match[1]) || {};
  return { data, body: match[2].replace(/^\n+/, '') };
}
function buildFrontmatter(data, body) {
  const yamlStr = jsyaml.dump(data, { lineWidth: -1 });
  return `---\n${yamlStr}---\n\n${body || ''}\n`;
}

/* ---------------------------------------------------------------------
   LOAD ENTRIES
--------------------------------------------------------------------- */
async function loadEntries() {
  await ensureYamlLibrary();
  setListStatus('Loading artworks…');
  const [files, homepageFile] = await Promise.all([
    ghListDir(CONTENT_DIR),
    ghGetFile(HOMEPAGE_SETTINGS_PATH)
  ]);
  if (homepageFile) {
    const settings = JSON.parse(base64ToUtf8(homepageFile.content));
    if (settings.heroSlug != null && typeof settings.heroSlug !== 'string') {
      throw new Error('Homepage hero settings have an invalid artwork ID.');
    }
    if (settings.heroImageField != null && !['image', 'thumbnail'].includes(settings.heroImageField)) {
      throw new Error('Homepage hero settings have an invalid image selection.');
    }
    homepageSettings = {
      heroSlug: settings.heroSlug || null,
      heroImageField: settings.heroImageField || null
    };
  } else {
    homepageSettings = { heroSlug: null, heroImageField: null };
  }
  const mdFiles = files.filter(f => f.type === 'file' && /\.md$/.test(f.name));
  entries = [];
  for (const f of mdFiles) {
    const file = await ghGetFile(`${CONTENT_DIR}/${f.name}`);
    const raw = base64ToUtf8(file.content);
    const { data, body } = parseFrontmatter(raw);
    entries.push({
      path: file.path,
      sha: file.sha,
      slug: f.name.replace(/\.md$/, ''),
      data,
      body
    });
  }
  entries.sort((a, b) => (a.data.displayOrder ?? 0) - (b.data.displayOrder ?? 0));
  renderGrid();
  setListStatus(`${entries.length} artwork${entries.length === 1 ? '' : 's'}`);
}

function setListStatus(msg) {
  document.getElementById('list-status').textContent = msg;
}

function showBanner(msg, type = 'info', timeoutMs = 4000) {
  const area = document.getElementById('banner-area');
  area.innerHTML = `<div class="status-banner ${type}">${msg}</div>`;
  const banner = area.firstChild;
  if (type === 'info' && timeoutMs > 0) {
    setTimeout(() => { if (area.firstChild === banner) area.innerHTML = ''; }, timeoutMs);
  }
}

/* ---------------------------------------------------------------------
   RENDER LIST
--------------------------------------------------------------------- */
function renderGrid() {
  const grid = document.getElementById('entry-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';
  empty.hidden = entries.length !== 0;

  for (const entry of entries) {
    const d = entry.data;
    const isHero = homepageSettings.heroSlug === entry.slug;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">${d.thumbnail || d.image ? `<img src="${d.thumbnail || d.image}" alt="">` : ''}</div>
      <div class="body">
        <div class="title">${escapeHtml(d.title || '(untitled)')}</div>
        <div class="meta">${escapeHtml(d.category || '')}${d.year ? ' · ' + d.year : ''}</div>
        ${d.dimensions ? `<div class="meta">${escapeHtml(VlementDimensions.formatDimensions(d.dimensions))}</div>` : ''}
        <div class="meta">${d.featured ? 'Featured on homepage' : 'Not featured'} · ${d.available === false ? 'Sold' : 'Available'}</div>
        <div class="code-label">${escapeHtml(window.VlementAdminArtworkCodes?.getCode(entry.slug)?.artwork_code || 'No artwork code')}</div>
        ${isHero ? `<div class="meta" style="color:var(--accent);font-weight:600">Homepage hero · ${homepageSettings.heroImageField === 'thumbnail' ? 'thumbnail' : 'full-size image'}</div>` : ''}
      </div>
      <div class="actions">
        <button class="btn edit-btn">Edit</button>
        <button class="btn danger delete-btn">Delete</button>
      </div>
    `;
    card.querySelector('.edit-btn').addEventListener('click', () => openEditor(entry));
    card.querySelector('.delete-btn').addEventListener('click', () => confirmDelete(entry));
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function releaseImagePreviews() {
  for (const state of Object.values(imageFields)) {
    if (state.url) URL.revokeObjectURL(state.url);
  }
}

function renderImageField(spec) {
  const state = imageFields[spec.key];
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = state.file ? URL.createObjectURL(state.file) : null;
  const preview = document.getElementById(`preview-${spec.id}`);
  const source = state.url || state.saved;
  preview.replaceChildren();
  if (source) {
    const image = document.createElement('img');
    image.alt = '';
    image.src = source;
    preview.append(image);
    if (spec.key === 'image' && state.file) {
      image.onload = () => {
        if (imageFields.image === state && state.url === source) {
          document.getElementById('f-width').value = image.naturalWidth;
          document.getElementById('f-height').value = image.naturalHeight;
        }
      };
      image.onerror = () => {
        document.getElementById('modal-error').textContent = 'The selected artwork image could not be read. Choose a valid image file.';
      };
    } else if (spec.key === 'image' && state.saved) {
      document.getElementById('f-width').value = editorData.width ?? '';
      document.getElementById('f-height').value = editorData.height ?? '';
    }
  } else {
    const empty = document.createElement('span');
    empty.textContent = 'none';
    preview.append(empty);
    if (spec.key === 'image') {
      document.getElementById('f-width').value = '';
      document.getElementById('f-height').value = '';
    }
  }
  document.getElementById(`delete-${spec.id}`).disabled = !source;
}

function duplicateArtwork() {
  const fields = ['title', 'year', 'medium', 'dimensions', 'displayOrder', 'width', 'height',
    'category', 'collection', 'summary', 'altText', 'price', 'editionType', 'editionSize', 'support', 'printDate'];
  const data = Object.fromEntries(fields.map(key => [key, document.getElementById(`f-${key}`).value]));
  data.featured = document.getElementById('f-featured').checked;
  data.signed = document.getElementById('f-signed').checked;
  data.available = true;
  const files = {};
  for (const { key } of imageFieldSpecs) {
    data[key] = imageFields[key].saved;
    files[key] = imageFields[key].file;
  }
  openEditor(null, { data, files, body: document.getElementById('f-body').value });
}

function refreshHeroImageOptions() {
  const select = document.getElementById('f-heroImage');
  if (!select) return;
  const currentSelection = select.value;
  const choices = [
    { value: '', label: 'Not the homepage hero' },
    ...((imageFields.image.saved || imageFields.image.file) ? [{ value: 'image', label: 'Use the full-size image' }] : []),
    ...((imageFields.thumbnail.saved || imageFields.thumbnail.file) ? [{ value: 'thumbnail', label: 'Use the thumbnail image' }] : [])
  ];
  select.innerHTML = choices.map(choice =>
    `<option value="${choice.value}" ${choice.value === currentSelection ? 'selected' : ''}>${choice.label}</option>`
  ).join('');
  if (homepageSettings.heroSlug === currentEntry?.slug && currentSelection) {
    select.querySelector('option[value=""]').disabled = true;
  }
}

function closeModal() {
  releaseImagePreviews();
  imageFields = {};
  document.getElementById('modal-overlay').hidden = true;
  currentEntry = null;
}

async function saveHomepageSettings(heroSlug, heroImageField) {
  const settings = { heroSlug, heroImageField };
  await ghPutFileSafe(
    HOMEPAGE_SETTINGS_PATH,
    utf8ToBase64(JSON.stringify(settings, null, 2) + '\n'),
    `Set homepage hero to ${heroSlug}`
  );
  homepageSettings = settings;
}

async function updateArtworkAvailability(slug, available, message) {
  await ensureYamlLibrary();
  const entry = entries.find(item => item.slug === slug);
  if (!entry) throw new Error('Refresh the artwork list before changing its availability.');
  for (let attempt = 0; attempt < 2; attempt++) {
    const latest = await ghGetFile(entry.path);
    if (!latest) throw new Error('The artwork file is missing from GitHub. Refresh the artwork list and try again.');
    const parsed = parseFrontmatter(base64ToUtf8(latest.content));
    const data = { ...parsed.data, available };
    try {
      const result = await ghPutFile(
        entry.path,
        utf8ToBase64(buildFrontmatter(data, parsed.body)),
        message,
        latest.sha
      );
      entry.data = data;
      entry.body = parsed.body;
      entry.sha = result?.content?.sha || latest.sha;
      renderGrid();
      return;
    } catch (error) {
      if (error.status !== 409 || attempt > 0) throw error;
    }
  }
  throw new Error('The artwork changed while its availability was being updated. Refresh and try again.');
}

/* ---------------------------------------------------------------------
   SAVE
--------------------------------------------------------------------- */
async function saveEntry() {
  const saveBtn = document.getElementById('save-btn');
  const errorBox = document.getElementById('modal-error');
  errorBox.innerHTML = '';
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span> Saving…';

  try {
    await ensureYamlLibrary();
    const title = document.getElementById('f-title').value.trim();
    if (!title) throw new Error('Title is required.');

    const isNew = !currentEntry;
    const year = Number(document.getElementById('f-year').value);
    let width = Number(document.getElementById('f-width').value);
    let height = Number(document.getElementById('f-height').value);
    const category = document.getElementById('f-category').value;
    const collection = document.getElementById('f-collection').value;
    if (!Number.isInteger(year) || year < 1900 || year > 2100) throw new Error('Enter a valid artwork year.');
    if (!(imageFields.image.file || imageFields.image.saved) || !(imageFields.thumbnail.file || imageFields.thumbnail.saved)) {
      throw new Error('A full-size picture and thumbnail are required. Choose a replacement before saving.');
    }
    if (imageFields.image.file) {
      let bitmap;
      try {
        bitmap = await createImageBitmap(imageFields.image.file, { imageOrientation: 'from-image' });
        width = bitmap.width;
        height = bitmap.height;
      } catch {
        throw new Error('The selected artwork image could not be read. Choose a valid image file.');
      } finally {
        bitmap?.close();
      }
    }
    if (!Number.isInteger(width) || width <= 0 || !Number.isInteger(height) || height <= 0) {
      throw new Error('Enter valid image width and height in pixels. Choosing a full-size image will fill these automatically.');
    }
    if (!category || !collection) throw new Error('Choose a category and collection before saving.');

    const data = {
      ...(duplicateDraft ? {} : editorData),
      title,
      year,
      width,
      height,
      medium: document.getElementById('f-medium').value.trim(),
      dimensions: document.getElementById('f-dimensions').value,
      category,
      collection,
      summary: document.getElementById('f-summary').value.trim(),
      image: imageFields.image.saved || undefined,
      thumbnail: imageFields.thumbnail.saved || undefined,
      portraitDownload: imageFields.portraitDownload.saved || undefined,
      landscapeDownload: imageFields.landscapeDownload.saved || undefined,
      altText: document.getElementById('f-altText').value.trim(),
      featured: document.getElementById('f-featured').checked,
      available: document.getElementById('f-available').checked,
      price: document.getElementById('f-price').value.trim() || undefined,
      editionType: document.getElementById('f-editionType').value || undefined,
      editionSize: document.getElementById('f-editionType').value === 'limited'
        ? Number(document.getElementById('f-editionSize').value)
        : undefined,
      support: document.getElementById('f-support').value.trim() || undefined,
      printDate: document.getElementById('f-printDate').value.trim() || undefined,
      signed: document.getElementById('f-signed').checked,
      displayOrder: Number(document.getElementById('f-displayOrder').value) || 0
    };
    if (data.editionType === 'limited'
      && (!Number.isInteger(data.editionSize) || data.editionSize < 1)) {
      throw new Error('Enter a valid limited-edition size.');
    }
    if (duplicateDraft && !data.editionType) {
      throw new Error('Choose a certificate artwork type for the duplicate before saving.');
    }
    const slug = isNew ? await chooseNewSlug(title, duplicateDraft) : currentEntry.slug;
    const mdPath = `${CONTENT_DIR}/${slug}.md`;
    const body = document.getElementById('f-body').value;
    const heroImageField = document.getElementById('f-heroImage').value;
    if (!heroImageField && homepageSettings.heroSlug === slug) {
      throw new Error('Select a full-size image or thumbnail to keep the current homepage hero.');
    }

    for (const spec of imageFieldSpecs) {
      const selected = imageFields[spec.key].file;
      if (!selected) continue;
      const file = await normalizeImageOrientation(selected);
      const name = `${slug}-${crypto.randomUUID()}.${extOf(file.name)}`;
      const path = `${spec.directory}/${name}`;
      await ghPutFile(path, await fileToBase64(file), `Upload ${spec.key} for ${title}`);
      data[spec.key] = `${spec.prefix}/${name}`;
    }

    // Clean undefined keys
    Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);

    const content = buildFrontmatter(data, body);
    const b64Content = utf8ToBase64(content);

    const putResult = isNew
      ? await ghPutFile(mdPath, b64Content, `Add artwork: ${title}`)
      : await ghPutFileSafe(mdPath, b64Content, `Update artwork: ${title}`);
    const newSha = putResult?.content?.sha;

    if (heroImageField && (
      homepageSettings.heroSlug !== slug
      || homepageSettings.heroImageField !== heroImageField
    )) {
      await saveHomepageSettings(slug, heroImageField);
    }

    // Update local state directly instead of re-fetching every entry from GitHub
    if (isNew) {
      entries.push({ path: mdPath, sha: newSha, slug, data, body });
    } else {
      const idx = entries.findIndex(e => e.path === currentEntry.path);
      if (idx !== -1) {
        entries[idx] = { path: mdPath, sha: newSha, slug, data, body };
      }
    }
    entries.sort((a, b) => (a.data.displayOrder ?? 0) - (b.data.displayOrder ?? 0));
    renderGrid();
    setListStatus(`${entries.length} artwork${entries.length === 1 ? '' : 's'}`);

    closeModal();
    if (isNew && data.editionType && window.VlementAdminArtworkCodes) {
      showBanner(`Saved "${title}". Creating its artwork code…`, 'info', 0);
      window.VlementAdminArtworkCodes.createForArtwork(slug, data.editionType, data.editionSize)
        .then(code => showBanner(`Saved "${title}" with code ${escapeHtml(code.artwork_code)}.`, 'info'))
        .catch(err => showBanner(`Saved "${title}", but its code was not created: ${escapeHtml(err.message)} Open Artwork Codes to retry.`, 'error', 0));
    } else if (isNew && data.editionType) {
      showBanner(`Saved "${title}", but the artwork-code tool is unavailable. Open Artwork Codes to retry.`, 'error', 0);
    } else if (isNew) {
      showBanner(`Saved "${title}". Choose a certificate artwork type to create its code in Artwork Codes.`, 'info', 0);
    } else {
      showBanner(`Saved "${title}".`, 'info');
    }
  } catch (err) {
    errorBox.innerHTML = `<div class="status-banner error">${escapeHtml(err.message)}</div>`;
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
}

/* ---------------------------------------------------------------------
   DELETE
--------------------------------------------------------------------- */
async function confirmDelete(entry) {
  if (homepageSettings.heroSlug === entry.slug) {
    showBanner('Choose a different homepage hero image before deleting this artwork.', 'error');
    return;
  }
  if (!confirm(`Delete "${entry.data.title || entry.slug}"? This removes the entry file (images are left in place).`)) return;
  try {
    const fresh = await ghGetFile(entry.path);
    await ghDeleteFile(entry.path, fresh?.sha || entry.sha, `Delete artwork: ${entry.data.title || entry.slug}`);
    entries = entries.filter(e => e.path !== entry.path);
    renderGrid();
    setListStatus(`${entries.length} artwork${entries.length === 1 ? '' : 's'}`);
    showBanner(`Deleted "${entry.data.title || entry.slug}".`, 'info');
  } catch (err) {
    showBanner(err.message, 'error');
  }
}

  document.getElementById('app-screen').hidden = false;
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn" id="certificates-btn">Certificates</button>
    <button class="btn" id="admin-exhibitions-btn">Exhibitions</button>
    <button class="btn" id="sales-btn">Sales</button>
    <button class="btn" id="artwork-codes-btn">Artwork Codes</button>
    <button class="btn" id="backup-everything-btn">Back up everything</button>
    <button class="btn" id="export-xlsx-btn">Export Excel (.xlsx)</button>
    <button class="btn" id="logout-btn">Sign out</button>
  `;
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('admin-exhibitions-btn').addEventListener('click', () => {
    window.VlementAdminExhibitions.open();
  });
  document.getElementById('sales-btn').addEventListener('click', () => {
    window.VlementSales.open();
  });
  document.getElementById('artwork-codes-btn').addEventListener('click', () => {
    window.VlementAdminArtworkCodes.open();
  });
  document.getElementById('export-xlsx-btn').addEventListener('click', window.exportArtworksExcel);
  loadEntries().then(() => {
    if (typeof initCollections === 'function') initCollections();
  }).catch(err => showBanner(err.message, 'error'));
}

document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('new-entry-btn').addEventListener('click', () => openEditor(null));
document.getElementById('refresh-btn').addEventListener('click', () => {
  loadEntries().catch(err => showBanner(err.message, 'error'));
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target.id === 'modal-overlay') closeModal();
});

window.VlementAdmin = {
  getEntries: () => entries,
  getToken: () => token,
  renderGrid,
  updateArtworkAvailability
};

if (token) {
  showApp();
}
</script>

if (token && window.VlementAdminArtworkCodes) {
  window.VlementAdminArtworkCodes.load().catch(error => {
    showBanner(`Artwork codes could not be loaded: ${escapeHtml(error.message)}`, 'error', 0);
  });
}
</script>
